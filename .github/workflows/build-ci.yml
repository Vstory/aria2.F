name: Build · CI

# 编译 + 单元测试门禁。内容取自上游 .github/workflows/build.yml（同款矩阵、ASan+UBSan、make -j check），
# 三处偏离上游：
#   ① 只跑 Linux —— 本 fork 不产出 macOS 产物，且上游写的 macos-14 已在 2026-11 退役；
#   ② action 钉完整 commit SHA —— 本 fork 开了 sha_pinning_required，写 @vX 会在 Set up job 阶段被拒；
#   ③ fail-fast: false —— 门禁要一次看全矩阵，默认在首个失败时取消其余 job，等于丢掉大半信号。
# 上游自己的 build.yml 在本 fork 永远死在 Set up job（策略拦截），已用仓库设置禁用，避免噪音红叉。

on:
  push:
    branches: ['**'] # 显式限定分支：只写 paths 过滤时 tag 推送也会触发
  pull_request:

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 60
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        crypto: [openssl, gnutls]
        bittorrent: [with-bt, without-bt]
        exclude:
        - crypto: openssl
          bittorrent: without-bt

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install deps
      run: |
        sudo apt-get update
        sudo apt-get install \
          g++-12 \
          clang-15 \
          autoconf \
          automake \
          autotools-dev \
          autopoint \
          libtool \
          pkg-config \
          libssl-dev \
          libgnutls28-dev \
          libc-ares-dev \
          zlib1g-dev \
          libsqlite3-dev \
          libssh2-1-dev \
          libcppunit-dev
    - name: Setup clang
      if: matrix.compiler == 'clang'
      run: |
        echo 'CC=clang-15' >> $GITHUB_ENV
        echo 'CXX=clang++-15' >> $GITHUB_ENV
    - name: Setup gcc
      if: matrix.compiler == 'gcc'
      run: |
        echo 'CC=gcc-12' >> $GITHUB_ENV
        echo 'CXX=g++-12' >> $GITHUB_ENV
    - name: Libtool
      run: |
        autoreconf -i
    - name: Setup compiler flags
      run: |
        asanflags="-fsanitize=address,undefined -fno-sanitize-recover=undefined"

        CPPFLAGS="$asanflags -g3"
        LDFLAGS="$asanflags"

        echo 'CPPFLAGS='"$CPPFLAGS" >> $GITHUB_ENV
        echo 'LDFLAGS='"$LDFLAGS" >> $GITHUB_ENV
    - name: Disable BitTorrent
      if: matrix.bittorrent == 'without-bt'
      run: |
        FEATURE_FLAGS="$FEATURE_FLAGS --disable-bittorrent"

        echo 'FEATURE_FLAGS='"$FEATURE_FLAGS" >> $GITHUB_ENV
    - name: Configure autotools (gnutls)
      if: matrix.crypto == 'gnutls'
      run: |
        ./configure --with-gnutls --without-openssl $FEATURE_FLAGS
    - name: Configure autotools (openssl)
      if: matrix.crypto == 'openssl'
      run: |
        ./configure --without-gnutls --with-openssl $FEATURE_FLAGS
    - name: Build aria2
      run: |
        make -j"$(nproc)" check
