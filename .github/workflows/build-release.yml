name: Build · Release

# 把 fork 的 master（= 上游最新代码）编成 9 个资产发一版：3 个源码包 + 2 个 Windows + 4 个 Android 架构
# （源码包与 Windows 与官方 release 同形态；Android 在官方的 aarch64 之外另出 armv7a / i686 / x86_64），
# 每次构建打一个新 tag、发一版一页（对齐官方 release-<版本> 的做法，不做滚动页、不清理旧页）。
# tag 名 = TAG_PREFIX + 版本串，形如 v1.37.0-r<日期>.<短号>：`-` 起预发布段，这样才是合法 semver（工具能解析）。
#
# 设计约束（见 ci/fork/README.md 之外的取舍都写在这里）：
#   · 上游的 Dockerfile.mingw / Dockerfile.android / mingw-release / android-release / script-helper
#     一律不改。容器侧的仓库地址与版本注入由 ci/fork/patch-dockerfile.sh 生成临时副本完成，
#     所以同步上游后不会产生这两类文件的冲突。
#   · 版本串注入只发生在工作区，不产生提交 —— fork 的 master 与上游保持逐字一致。
#   · 上游正式版是维护者本机跑 makerelease 手工发布的（CI 里从来没有发布步骤），本工作流把
#     同一套流程（make dist-* + docker build mingw/android + 打包脚本）搬到 CI。
#   · 本 fork 开了 sha_pinning_required（仓库设置），action 写 @vX 会被直接拒：
#     "is not allowed ... because all actions must be pinned to a full-length commit SHA"。
#     上游的 build.yml 因此在 fork 上永远跑不起来。此文件里的 action 一律钉完整 SHA，
#     升级时连同行尾版本注释一起改（Dependabot 也认这种形式）。

# 触发：代码进 master 就自动发一版（push），手动 workflow_dispatch 只作逃生口（可换 ref 发版）。
#   注意 push 触发时 `inputs` 上下文为空 ⇒ 全部 ref 取值写成 `inputs.ref || github.ref_name`，
#   否则 version job 会拿空 ref 去 ls-remote、直接报「解析不出 ref」。
on:
  push:
    branches: ['master']
    paths-ignore:            # 纯文档改动不发正式版
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      ref:
        description: 构建的 ref（分支或 tag），默认 fork master
        default: master
        required: true

permissions:
  contents: write

# 同一 tag 的重跑会同时往同一页传资产（重复上传同名资产会 422）⇒ 串行排队
concurrency:
  group: release-ci
  cancel-in-progress: false

env:
  FORK_REPO: https://github.com/Vstory/aria2.F
  UPSTREAM_REPO: https://github.com/aria2/aria2
  BASE_VERSION: '1.37.0'
  BASE_RELEASE_TAG: release-1.37.0
  # tag 名 = 前缀 + 版本串。前缀留空 ⇒ tag 就是版本串本身（例：1.37.0.r20261012.a1b2c3d）
  TAG_PREFIX: 'v'
  # 'true' ⇒ 页面挂 Pre-release 徽标、不抢 Latest
  RELEASE_PRERELEASE: 'true'
  ALLOW_STUB_MAN: 'false'

jobs:
  version:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      sha: ${{ steps.v.outputs.sha }}
      upstream_sha: ${{ steps.v.outputs.upstream_sha }}
    steps:
      - id: v
        env:
          REF: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          SHA=""
          for r in "refs/heads/$REF" "refs/tags/$REF^{}" "refs/tags/$REF"; do
            SHA=$(git ls-remote "$FORK_REPO" "$r" | sed -n 1p | cut -f1)
            [ -n "$SHA" ] && break
          done
          [ -n "$SHA" ] || { echo "::error::解析不出 ref $REF 的 commit"; exit 1; }
          # 发布页正文要挂上游开发线的当前尖端，每次构建现取
          UPSTREAM_SHA=$(git ls-remote "$UPSTREAM_REPO" refs/heads/master | sed -n 1p | cut -f1)
          [ -n "$UPSTREAM_SHA" ] || { echo "::error::解析不出上游 master 的 commit"; exit 1; }
          VERSION="$BASE_VERSION-r$(date -u +%Y%m%d).${SHA:0:7}"
          TAG="$TAG_PREFIX$VERSION"
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "sha=$SHA"
            echo "upstream_sha=$UPSTREAM_SHA"
          } >>"$GITHUB_OUTPUT"
          {
            echo "### 版本串 \`$VERSION\`"
            echo
            echo "- 发布 tag：\`$TAG\`（一版一页）"
            echo "- 构建 ref：\`$REF\`（\`$SHA\`）"
            echo "- 上游基线：\`$BASE_RELEASE_TAG\`（上游 master 当前 \`${UPSTREAM_SHA:0:7}\`）"
          } >>"$GITHUB_STEP_SUMMARY"
          echo "version=$VERSION tag=$TAG sha=$SHA"

  source:
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          fetch-depth: 0
      - name: Install build deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake autotools-dev autopoint libtool pkg-config \
            git g++ libssl-dev libgnutls28-dev libc-ares-dev zlib1g-dev \
            libsqlite3-dev libssh2-1-dev libxml2-dev libcppunit-dev \
            python3-docutils
          # sphinx 钉在 7.2.6：官方 1.37.0 的 man page 是 2023-11 生成的，新版 sphinx
          # 对这份老 conf.py（extensions 为空 + 仓库内主题）不保证能过
          pip3 install --quiet "sphinx==7.2.6"
      - name: Prepare source tree
        run: |
          set -euo pipefail
          git fetch --no-tags "$UPSTREAM_REPO" \
            "refs/tags/$BASE_RELEASE_TAG:refs/tags/$BASE_RELEASE_TAG"
          ci/fork/prepare-source.sh inject "$VERSION"
          ci/fork/prepare-source.sh changelog "$BASE_RELEASE_TAG"
          ci/fork/prepare-source.sh patches
      - name: Build dist tarballs
        run: |
          set -euo pipefail
          autoreconf -i
          ./configure
          # 三个 dist-* 必须各起一次 make：automake 打完一个包就把 distdir 删掉，
          # 连写成 `make dist-gzip dist-bzip2 dist-xz` 会让后两个 tar 报 Cannot stat
          make dist-gzip
          make dist-bzip2
          make dist-xz
      - name: Verify dist tarballs
        run: ci/fork/verify-dist.sh "$VERSION" "$ALLOW_STUB_MAN"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meta
          # artifact 只是 job 间的传递介质，产物已在 release 里 ⇒ 1 天即清，少占 Actions 存储
          retention-days: 1
          path: |
            ChangeLog
            README.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sources
          retention-days: 1
          path: aria2-*.tar.*

  mingw:
    needs: [version, source]
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: i686-w64-mingw32
            label: win-32bit
          - host: x86_64-w64-mingw32
            label: win-64bit
    env:
      HOST: ${{ matrix.host }}
      LABEL: ${{ matrix.label }}
      VERSION: ${{ needs.version.outputs.version }}
      # 按 commit 取源码的 sha：既给 patch 脚本，也作为 Dockerfile 的缓存哨兵参数（ARG 名仍是 ARIA2_REF）
      ARIA2_SHA: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref_name }}
      - name: Fetch ChangeLog / README.html
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: meta
      # zip 里要放带短号的版本名，而 ./mingw-release 是从本工作区的 configure.ac 读版本的
      - name: Inject version into workspace
        run: ci/fork/prepare-source.sh inject "$VERSION"
      - name: Patch Dockerfile (temp copy)
        run: ci/fork/patch-dockerfile.sh Dockerfile.mingw /tmp/Dockerfile.mingw.build
      - name: Build mingw image and extract binary
        run: |
          set -euo pipefail
          docker build \
            --build-arg HOST="$HOST" \
            --build-arg ARIA2_REF="$ARIA2_SHA" \
            -f /tmp/Dockerfile.mingw.build \
            -t "aria2-mingw-$HOST" .
          mkdir -p mingw-out
          docker run --rm -v "$PWD/mingw-out:/out" "aria2-mingw-$HOST" \
            cp /aria2/src/aria2c.exe /out
          ls -la mingw-out
      - name: Package
        run: ./mingw-release
      - name: Verify package
        run: |
          set -euo pipefail
          ZIP="aria2-$VERSION-$LABEL-build1.zip"
          [ -f "$ZIP" ] || { echo "::error::缺产物 $ZIP"; exit 1; }
          ZIP="$ZIP" python3 - <<'PY'
          import os, zipfile
          z = zipfile.ZipFile(os.environ["ZIP"])
          names = z.namelist()
          need = ["aria2c.exe", "AUTHORS", "COPYING", "ChangeLog", "LICENSE.OpenSSL",
                  "NEWS", "README.html", "README.mingw"]
          missing = [n for n in need if not any(i.endswith("/" + n) for i in names)]
          if missing:
              raise SystemExit("::error::%s 缺少 %s" % (os.environ["ZIP"], missing))
          readme = next(i for i in names if i.endswith("README.html"))
          if b"Readme has not been built" in z.read(readme):
              raise SystemExit("::error::zip 里的 README.html 是 rst2html 缺失时的占位文件")
          print("  ✅ %s：%d 项（含 %s）" % (os.environ["ZIP"], len(names), need[0]))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mingw-${{ matrix.label }}
          retention-days: 1
          path: aria2-*-${{ matrix.label }}-build1.zip

  android:
    needs: [version, source]
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # NDK 三元组名，同时用作包名后缀（与上游 aarch64 那个资产同构）
        host:
          - aarch64-linux-android
          - armv7a-linux-androideabi
          - i686-linux-android
          - x86_64-linux-android
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARIA2_SHA: ${{ needs.version.outputs.sha }}
      ANDROID_HOST: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref_name }}
      - name: Fetch ChangeLog / README.html
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: meta
      - name: Inject version into workspace
        run: ci/fork/prepare-source.sh inject "$VERSION"
      - name: Patch Dockerfile (temp copy)
        run: ci/fork/patch-dockerfile.sh Dockerfile.android /tmp/Dockerfile.android.build
      # 上游的 android-release 把架构写死在 DIST_DIR 里（不像 mingw-release 吃 LABEL 环境变量），
      # 多架构必须参数化；改的是工作区副本、不产生提交。命中不足即 fail —— 上游改了这行就会响铃。
      - name: Patch android-release for target ABI
        run: |
          set -euo pipefail
          sed -i 's|^DIST_DIR=aria2-\$VERSION-aarch64-linux-android-build1$|DIST_DIR=aria2-$VERSION-${ANDROID_HOST}-build1|' android-release
          grep -qF 'DIST_DIR=aria2-$VERSION-${ANDROID_HOST}-build1' android-release || {
            echo "::error::android-release 的 DIST_DIR 未按预期改写：上游结构已变"; exit 1; }
      - name: Build android image and extract binary
        run: |
          set -euo pipefail
          IMAGE="aria2-android-$ANDROID_HOST"
          docker build -f /tmp/Dockerfile.android.build -t "$IMAGE" .
          mkdir -p android-out
          docker run --rm -v "$PWD/android-out:/out" "$IMAGE" \
            cp /root/build/aria2/src/aria2c /out
          file android-out/aria2c
      - name: Package
        run: ./android-release
      - name: Verify package
        run: |
          set -euo pipefail
          ZIP="aria2-$VERSION-$ANDROID_HOST-build1.zip"
          [ -f "$ZIP" ] || { echo "::error::缺产物 $ZIP"; exit 1; }
          # 防「矩阵对、镜像里编错架构」：按三元组核对 ELF 头
          case "$ANDROID_HOST" in
            aarch64-linux-android)    want="64-bit.*ARM aarch64" ;;
            armv7a-linux-androideabi) want="32-bit.*ARM, EABI5" ;;
            i686-linux-android)       want="32-bit.*Intel 80386" ;;
            x86_64-linux-android)     want="64-bit.*x86-64" ;;
            *) echo "::error::未知架构 $ANDROID_HOST"; exit 1 ;;
          esac
          file android-out/aria2c | grep -qE "$want" || {
            echo "::error::$ANDROID_HOST 的产物架构不符：$(file android-out/aria2c)"; exit 1; }
          ZIP="$ZIP" python3 - <<'PY'
          import os, zipfile
          z = zipfile.ZipFile(os.environ["ZIP"])
          names = z.namelist()
          need = ["aria2c", "AUTHORS", "COPYING", "ChangeLog", "LICENSE.OpenSSL",
                  "NEWS", "README.html", "README.android"]
          missing = [n for n in need if not any(i.endswith("/" + n) for i in names)]
          if missing:
              raise SystemExit("::error::%s 缺少 %s" % (os.environ["ZIP"], missing))
          readme = next(i for i in names if i.endswith("README.html"))
          if b"Readme has not been built" in z.read(readme):
              raise SystemExit("::error::zip 里的 README.html 是 rst2html 缺失时的占位文件")
          print("  ✅ %s：%d 项（含 %s）" % (os.environ["ZIP"], len(names), need[0]))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-${{ matrix.host }}
          retention-days: 1
          path: aria2-*-${{ matrix.host }}-build1.zip

  publish:
    needs: [version, source, mingw, android]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # publish 不 checkout，gh 无法从 git remote 推断仓库，必须显式告诉它
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      SHA: ${{ needs.version.outputs.sha }}
      UPSTREAM_SHA: ${{ needs.version.outputs.upstream_sha }}
    steps:
      # 只取产物 artifact；meta（ChangeLog / README.html）是 job 间打包用的传递介质，
      # 一并拉下来会让下面的资产数检查多出两个文件
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sources
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mingw-win-32bit
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mingw-win-64bit
          path: dist
      # android 各架构的产物用 pattern 一次拉全（sources / mingw / meta 不匹配 android-*）
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: android-*
          path: dist
          merge-multiple: true
      - name: Check asset set
        run: |
          set -euo pipefail
          ls -l dist
          count=$(find dist -type f | wc -l)
          [ "$count" -eq 9 ] || { echo "::error::资产数 $count（期望 9）"; exit 1; }
          for f in "aria2-$VERSION.tar.gz" "aria2-$VERSION.tar.bz2" "aria2-$VERSION.tar.xz" \
                   "aria2-$VERSION-win-32bit-build1.zip" "aria2-$VERSION-win-64bit-build1.zip" \
                   "aria2-$VERSION-aarch64-linux-android-build1.zip" \
                   "aria2-$VERSION-armv7a-linux-androideabi-build1.zip" \
                   "aria2-$VERSION-i686-linux-android-build1.zip" \
                   "aria2-$VERSION-x86_64-linux-android-build1.zip"; do
            [ -f "dist/$f" ] || { echo "::error::缺资产 $f"; exit 1; }
          done
      - name: Publish release
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          NOTES="构建 [${SHA:0:7}]($FORK_REPO/commit/$SHA)；上游基线 $BASE_RELEASE_TAG [${UPSTREAM_SHA:0:7}]($UPSTREAM_REPO/commit/$UPSTREAM_SHA)。"
          # 展开时不加引号是有意的：空值必须让该参数整体消失
          PRERELEASE_FLAG=""
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease --latest=false"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 同一版本重跑（修 CI 用）走这一支：刷新正文、覆盖同名资产，不新建 tag
            echo "tag $TAG 已存在 —— 按重跑处理"
            gh release edit "$TAG" --notes "$NOTES" $PRERELEASE_FLAG
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --target "$SHA" \
              $PRERELEASE_FLAG \
              --notes "$NOTES"
          fi
          gh release upload "$TAG" dist/* --clobber
      - name: Summarize
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          {
            echo "### 已发布 \`$TAG\`"
            echo
            echo "- 下载页：https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
            echo "- 构建 commit：\`$SHA\`"
          } >>"$GITHUB_STEP_SUMMARY"
